name: Run tests
on:
  pull_request:
  push:
    branches: [develop, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-python@v2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --extras spacy
          poetry run python -m spacy download en_core_web_sm
          sudo apt-get update && sudo apt-get install -y espeak-ng

      - name: Build Cython extensions
        run: poetry run python setup.py build_ext --inplace

      - name: Lint (ruff)
        run: poetry run ruff check stark/ tests/

      - name: Run pytest
        run: poetry run pytest

      - name: Type check (mypy)
        run: poetry run mypy stark/ tests/

      # ty is pre-1.0 (0.0.x): it does not yet model STARK's metaclass Union magic
      # and dynamic parsed-attribute access, so a handful of documented false
      # positives remain. Keep it visible in CI but non-blocking until it matures.
      - name: Type check (ty, non-blocking)
        run: poetry run ty check stark/ tests/
        continue-on-error: true

      - name: Duck Notifier
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          message: ❌ S.T.A.R.K. push tests failed on branch ${{ github.ref }}
