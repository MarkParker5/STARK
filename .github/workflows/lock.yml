name: Lock check

# Fail fast if poetry.lock drifts from pyproject.toml — catch it on a PR/develop
# push instead of on master, where it breaks the release + docs pipelines.
on:
  pull_request:
  push:
    branches: [develop, master]
  workflow_dispatch:

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install poetry
      - name: poetry.lock in sync with pyproject.toml
        run: poetry check --lock
