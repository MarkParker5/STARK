site_name: S.T.A.R.K. Docs
site_author: Mark Parker
site_description: Speach and Text Algorithmic Recognition Kit (S.T.A.R.K.) is a set of tools for building custom voice assistants. It is designed to be modular and extensible, allowing you to build your own custom voice assistant with ease.
site_url: https://stark.markparker.me

repo_name: MarkParker5/STARK
repo_url: https://github.com/MarkParker5/STARK

copyright: Copyright &copy; Mark Parker

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - "Hello World": getting-started/first-steps.md
      - Creating Commands: getting-started/creating-commands.md
  - Core Concepts:
      - Overview: core-concepts/index.md
      - Patterns: core-concepts/patterns.md
      - Command Response: core-concepts/command-response.md
      - Commands Context: core-concepts/commands-context.md
      - Dependency Injection: core-concepts/dependency-injection.md
      - Sync vs Async Commands: core-concepts/sync-vs-async-commands.md
  - Running Your Assistant:
      - Overview: running/index.md
      - How to Run: running/how-to-run.md
      - Voice Assistant & Modes: running/voice-assistant.md
      - Default Speech Interfaces: running/default-speech-interfaces.md
      - Custom IO & Context Delegate: running/custom-interfaces.md
      - Where to Host: running/where-to-host.md
  - Going Multilingual:
      - localization-and-multilingual/index.md
      - Localizing Parsing: localization-and-multilingual/localizing-parsing.md
      - Multilanguage Input: localization-and-multilingual/multilanguage-input.md
      - Localizing Responses: localization-and-multilingual/localizing-responses.md
  - Tools:
      - Overview: tools/index.md
      - Phonetic Dictionary - Cross-language Name Lookup: tools/phonetic-dictionary.md
      - Phonetic Corrections (Fuzzy Matching): tools/corrections.md
      - Raw Phonetic Tools (IPA & Simplephone): tools/raw-phonetic.md
      - Levenshtein - Fast Fuzzy String Matching (Cython): tools/stark-levenshtein.md
      - Sliding Window Parser: tools/sliding-window-parser.md
      - Speech Recognition (STT): tools/speech-recognition.md
      - Speech Synthesis (TTS): tools/speech-synthesis.md
  - Going Deeper:
      - Custom Run: advanced/custom-run.md
      - Custom Processors: advanced/custom-processors.md
      - External Triggers: advanced/external-triggers.md
      - Fallback Command / LLM Integration: advanced/fallback-command-llm-integration.md
      - Feature Flags: advanced/feature-flags.md
      - Optimization: advanced/optimization.md
  - AI Agent Platform: agent-platform.md
  - Ecosystem:
      - STARK-PLACE: ecosystem/index.md
      - Package Registry: ecosystem/package-registry.md
      - Project Ideas: ecosystem/project-ideas.md
      - Roadmap: ecosystem/roadmap.md

theme:
  name: material
  custom_dir: overrides
  language: en

  icon:
    repo: fontawesome/brands/github

  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    # - navigation.instant.prefetch
    - navigation.path
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

  palette:
    # Palette toggle for automatic mode
    # - media: "(prefers-color-scheme)"
    #   primary: orange
    #   accent: orange
    #   toggle:
    #     icon: material/brightness-auto
    #     name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      primary: orange
      accent: orange
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: orange
      accent: orange
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to system preference

extra:
  generator: false

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MarkParker5/

  features:
    - navigation.footer

  analytics:
    provider: google
    property: G-DK2VMEE8DP

extra_css:
  - stylesheets/gh-embed.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js
  - javascripts/gh-tree.js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - toc:
      permalink: true

hooks:
  - hooks/llms_enrich.py

plugins:
  - search
  - social
  # - optimize
  # - tags
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - llmstxt:
      markdown_description: |
        S.T.A.R.K. (Speech and Text Advanced Recognition Kit) is a modern, async Python framework
        for building voice assistants and natural language interfaces. Think FastAPI but for speech.
        It runs on-device, supports multiple languages, integrates with LLMs, and features advanced
        pattern-based NL parsing, context-aware commands, and community extensions via STARK-PLACE.
      full_output: llms-full.txt
      sections:
        Getting Started:
          - getting-started/installation.md
          - getting-started/first-steps.md
          - getting-started/creating-commands.md
        Core Concepts:
          - core-concepts/index.md
          - core-concepts/sync-vs-async-commands.md
          - core-concepts/command-response.md
          - core-concepts/commands-context.md
          - core-concepts/patterns.md
          - core-concepts/dependency-injection.md
        Running Your Assistant:
          - running/index.md
          - running/how-to-run.md
          - running/voice-assistant.md
          - running/default-speech-interfaces.md
          - running/custom-interfaces.md
          - running/where-to-host.md
        Tools:
          - tools/*.md
        Advanced:
          - advanced/*.md
        Localization and Multi-Language:
          - localization-and-multilingual/*.md
        Whats Next:
          - agent-platform.md
        Ecosystem:
          - ecosystem/index.md
          - ecosystem/package-registry.md
          - ecosystem/project-ideas.md
          - ecosystem/roadmap.md
  # - git-committers:
  #     repository: MarkParker5/STARK
  #     branch: master
