[tool.poetry]
name = "stark-engine"
version = "4.6.0"
description = "S.T.A.R.K - Speech and Text Advanced Recognition Kit. Modern framework for creating powerfull voice assistants."
authors = ["MarkParker5 <mark@parker-programs.com>"]
license = "PolyForm-Noncommercial-1.0.0"
readme = "README.md"
packages = [{ include = "stark" }]
homepage = "https://pypi.org/project/stark-engine/"
repository = "https://github.com/MarkParker5/STARK"
documentation = "https://stark.markparker.me"
keywords = [
    "python",
    "open-source",
    "natural-language-processing",
    "framework",
    "cross-platform",
    "natural-language",
    "voice",
    "voice-commands",
    "python3",
    "voice-recognition",
    "speech-recognition",
    "speech-to-text",
    "community-project",
    "voice-assistant",
    "voice-interface",
    "NLP",
    "machine-learning",
    "AI",
    "text-analysis",
    "stark",
    "stark-place",
    "stark-engine",
    "mark parker",
]


[tool.poetry.dependencies]
python = ">=3.12,<3.15"
pydantic = "^2.0.0"
asyncer = ">=0.0.8,<1.0.0"
anyio = ">=4.0.0,<5.0.0"
numpy = "^2.3.3"

# Optional dependencies
sounddevice = { version = "^0.4.5", optional = true }
soundfile = { version = "^0.11.0", optional = true }
vosk = { version = "0.3.44", optional = true }
google-cloud-texttospeech = { version = "^2.14.1", optional = true }
torch = { version = "^1.13.1", optional = true }
spacy = { version = "^3.8.11", optional = true }

[tool.poetry.extras]
gcloud = ["google-cloud-texttospeech", "sounddevice", "soundfile"]
vosk = ["vosk", "sounddevice"]
silero = ["torch", "sounddevice"]
sound = ["sounddevice", "soundfile"]
spacy = ["spacy"]
all = [
    "google-cloud-texttospeech",
    "vosk",
    "torch",
    "sounddevice",
    "soundfile",
    "spacy",
]

[tool.poetry.group.dev.dependencies]
mkdocs-material = {extras = ["imaging"], version = "^9.6.22"}
mkdocs-git-revision-date-localized-plugin = "^1.4.7"
cython = "^3.1.5"
setuptools = ">=80.9,<84.0"
mypy = "^1.1.1"
pytest = ">=8.1"
pytest-asyncio = "^0.21.1"
pytest-trio = "^0.8.0"
pytest-repeat = "^0.9.1"
pytest-benchmark = "^5.1.0"
pytest-profiling = "^1.8.1"
pytest-resource-usage = "^1.0.0"
pytest-timeout = "^2.4.0"
pytest-cov = "^7.0.0"
coverage = "^7.11.0"
faker = "^37.11.0"
pympler = "^1.1"
psutil = "^7.1.1"
trio = "^0.33.0"
mkdocs-llmstxt = "^0.5.0"
poethepoet = "^0.29.0"
ruff = "^0.16.2"
ty = "^0.0.71"

[tool.poe.tasks]
# quick shortcuts:  poetry run poe <name>
viz  = { shell = "cd visualizer && npm run build && cd .. && python -m profiler.server", help = "Build the UI + serve on http://localhost:8765" }
ui   = { cmd = "npm run dev", cwd = "visualizer", help = "Vite dev server (hot reload)" }
test = { cmd = "python -m pytest tests/test_profiling/", help = "Run the profiler tests" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# asyncio_mode = "auto"
trio_mode = "true"
filterwarnings = ["once"]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

[tool.mypy]
ignore_missing_imports = true
exclude = ["stark/core/types/Time.*", "stark/core/types/Number.*", "stark/tools/dictionary/!examples.py"]

[tool.ty.src]
# Illustrative doc snippet with intentionally-undefined names (parallels mypy/ruff exclude).
exclude = ["**/dictionary/?examples.py"]  # matches "!examples.py" (`?` sidesteps leading-! glob negation)

[tool.ty.rules]
# Optional extras (torch / matplotlib / epitran) are not installed in the base env;
# this parallels mypy's `ignore_missing_imports = true`.
unresolved-import = "ignore"
# mypy's `# type: ignore` comments coexist in the source; ty cannot tell they target
# mypy and would otherwise flag them as unused.
unused-type-ignore-comment = "ignore"

# Tests exercise the engine's dynamic Object[T] metaclass: parameter types are
# synthesized at parse time (result.obj.<field>), Object subclasses are fed into
# register_parameter_type/parse_object, and patterns use the `$x:A | $y:B` DSL via
# Object.__or__. ty (pre-1.0) can't model any of these statically — mypy (blocking)
# validates the same code with 0 errors. Scope the affected rules to tests only so
# they stay fully active in production (e.g. recognizer_relay.py is still checked).
[[tool.ty.overrides]]
include = ["tests/**"]
rules = { "unresolved-attribute" = "ignore", "unsupported-operator" = "ignore", "invalid-argument-type" = "ignore" }

[tool.ruff]
line-length = 120
target-version = "py312"
# Illustrative/tutorial snippet with intentionally undefined names (F821).
exclude = ["stark/tools/dictionary/!examples.py"]

[tool.ruff.lint]
# Curated, meaningful set: correctness (E/F), import hygiene (I), modernization
# (UP), bugbear (B), simplify (SIM), comprehensions (C4), misc lint (PIE),
# pytest style (PT), timezone safety (DTZ), Ruff-native (RUF), plus a few
# high-signal Pylint refactors (PLR). E501 is intentionally excluded: the
# codebase has ~99 wide data/expectation literals and reflowing them would be
# pure churn with no correctness benefit.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "DTZ",  # flake8-datetimez
    "RUF",  # Ruff-specific
    "PLR1704",  # redefined-argument-from-local
    "TRY002",   # raise-vanilla-class
    "TRY004",   # type-check-without-type-error
]
ignore = [
    "E501",   # line-too-long: many wide data literals; reflow would be churn
    "RUF001", # ambiguous-unicode (string): multilingual NLP data, non-ASCII is intentional
    "RUF002", # ambiguous-unicode (docstring): idem
    "RUF003", # ambiguous-unicode (comment): idem
]

[tool.ruff.lint.per-file-ignores]
# Intentional re-exports.
"__init__.py" = ["F401"]
# This test deliberately exercises Optional[X] / Union[X, None] slot annotations
# as the subject under test (both spellings side by side); keep the legacy forms.
"tests/test_nl_objects/test_rules.py" = ["UP007", "UP045"]
# Deliberate pre-import side effect: silence faker logging before it is imported.
"tests/conftest.py" = ["E402"]
# Test-local Union subclasses assign the `_types` registry (mirroring MakeUnion);
# these are deliberate class-attribute overrides, not a mutability hazard.
"tests/test_core/test_union.py" = ["RUF012"]
